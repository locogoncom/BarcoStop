import java.util.Properties
import java.util.TimeZone

plugins {
    id 'com.android.application'
}

def credentials = new Properties()
def credentialsFile = rootProject.file("config/credentials.ttb.properties")
if (credentialsFile.exists()) {
    credentialsFile.withInputStream { credentials.load(it) }
}

def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file("keystore.properties")
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

def cred = { String key, String fallback = "" ->
    def raw = credentials.getProperty(key)
    return raw == null ? fallback : raw.trim()
}

def signingCred = { String credentialsKey, String keystoreKey, String fallback = "" ->
    def raw = credentials.getProperty(credentialsKey)
    if (raw != null && !raw.trim().isEmpty()) {
        return raw.trim()
    }
    def local = keystoreProps.getProperty(keystoreKey)
    return local == null ? fallback : local.trim()
}

def q = { String value ->
    return value.replace("\\", "\\\\").replace("\"", "\\\"")
}

def buildDateUtc = cred(
        "BARCOSTOP_BUILD_DATE_UTC",
        new Date().format("yyyy-MM-dd HH:mm 'UTC'", TimeZone.getTimeZone("UTC"))
)

def versionDateUtc = new Date()
def versionSlot = System.currentTimeMillis().intdiv(600000L) % 10L
def generatedVersionCode = ("58" + versionDateUtc.format("yyMMdd", TimeZone.getTimeZone("UTC")) + versionSlot).toInteger()
def generatedVersionName = "58." + versionDateUtc.format("yyyy.MM.dd-HHmm", TimeZone.getTimeZone("UTC"))
def appVersionCode = (project.findProperty("BARCOSTOP_VERSION_CODE") ?: generatedVersionCode.toString()).toInteger()
def appVersionName = project.findProperty("BARCOSTOP_VERSION_NAME") ?: generatedVersionName

def releaseStoreFile = signingCred("RELEASE_STORE_FILE", "storeFile")
def releaseStorePassword = signingCred("RELEASE_STORE_PASSWORD", "storePassword")
def releaseKeyAlias = signingCred("RELEASE_KEY_ALIAS", "keyAlias")
def releaseKeyPassword = signingCred("RELEASE_KEY_PASSWORD", "keyPassword")

def hasReleaseSigning =
    !releaseStoreFile.isEmpty() &&
    !releaseStorePassword.isEmpty() &&
    !releaseKeyAlias.isEmpty() &&
    !releaseKeyPassword.isEmpty()

android {
    namespace 'com.barcostop.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.barcostop.app'
        minSdk 21
        targetSdk 35
        versionCode appVersionCode
        versionName appVersionName
        buildConfigField "String", "BUILD_DATE_UTC", "\"" + q(buildDateUtc) + "\""
        buildConfigField "String", "API_BASE_URL", "\"" + q(cred("BARCOSTOP_API_BASE_URL", "https://api.barcostop.net/api/v1/")) + "\""
        buildConfigField "String", "WS_URL", "\"" + q(cred("BARCOSTOP_WS_URL", "https://api.barcostop.net")) + "\""
        buildConfigField "String", "APP_ENV", "\"" + q(cred("BARCOSTOP_ENV", "prod")) + "\""
        buildConfigField "String", "GOOGLE_WEB_CLIENT_ID", "\"" + q(cred("GOOGLE_WEB_CLIENT_ID", "")) + "\""
        buildConfigField "String", "GOOGLE_ANDROID_CLIENT_ID", "\"" + q(cred("GOOGLE_ANDROID_CLIENT_ID", "")) + "\""
        buildConfigField "String", "REDDIT_CLIENT_ID", "\"" + q(cred("REDDIT_CLIENT_ID", "")) + "\""
        buildConfigField "String", "REDDIT_USERNAME", "\"" + q(cred("REDDIT_USERNAME", "")) + "\""
        buildConfigField "String", "REDDIT_SUBREDDIT", "\"" + q(cred("REDDIT_SUBREDDIT", "")) + "\""
        buildConfigField "String", "JWT_EXPECTED_ISSUER", "\"" + q(cred("JWT_EXPECTED_ISSUER", "")) + "\""
        buildConfigField "String", "JWT_EXPECTED_AUDIENCE", "\"" + q(cred("JWT_EXPECTED_AUDIENCE", "")) + "\""
        buildConfigField "String", "PAYPAL_ME", "\"" + q(cred("PAYPAL_ME", "https://paypal.me/BarcoStop")) + "\""

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'com.google.android.gms:play-services-auth:21.2.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'com.google.zxing:core:3.5.3'
}
